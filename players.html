<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CLUBVMK · Player Admin</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
<style>
  .aw { max-width: 1120px; margin: 0 auto; padding: 24px 18px 90px; position: relative; z-index: 1; }
  .ahead { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 4px; flex-wrap: wrap; }
  .ahead h1 { font-family: "Fraunces", serif; font-size: 30px; margin: 0; }
  .navlinks a { color: var(--muted); text-decoration: none; margin-left: 14px; font-size: 14px; }
  .navlinks a:hover { color: var(--gold); }
  .gate { text-align: center; padding: 80px 20px; }
  .subtle { color: var(--faint); font-size: 13px; margin: 0 0 12px; }
  .btn { padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line); background: transparent; color: #cdd; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.gold { background: var(--gold); color: #201800; border: none; }
  .btn.danger { border-color: #7a2233; color: #ff9aa8; }
  .btn:disabled { opacity: .5; cursor: default; }
  input, select { padding: 8px 11px; border-radius: 9px; border: 1px solid var(--line);
                  background: #0c1020; color: #eef; font: inherit; }

  .cols { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
  .panel { background: #12162a; border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .panel h2 { font-family: "Fraunces", serif; font-size: 17px; margin: 0 0 10px; }

  .plist { max-height: 560px; overflow: auto; margin-top: 10px; }
  .prow { display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px;
          border-radius: 9px; cursor: pointer; }
  .prow:hover { background: rgba(150,165,230,.07); }
  .prow.on { background: rgba(240,178,60,.14); outline: 1px solid var(--gold); }
  .prow small { color: var(--faint); }

  .who { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .who h2 { margin: 0; font-size: 21px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin: 14px 0 6px; }
  .stat { background: #0e1226; border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; }
  .stat .v { font-family: "Fraunces", serif; font-size: 20px; font-weight: 700; }
  .stat .k { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; }
  /* wallet tiles lead the row — they're what you check before a refund */
  .stat.wallet { border-color: rgba(240,178,60,.45); background: #171532; }
  .stat.wallet .v { color: var(--gold-soft, #ffd27a); }
  .prow small { text-align: right; line-height: 1.5; }

  .tools { display: grid; gap: 14px; margin-top: 16px; }
  .tool { border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; background: #0e1226; }
  .tool h3 { margin: 0 0 4px; font-size: 14px; }
  .tool p { margin: 0 0 10px; font-size: 12px; color: var(--faint); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  /* every input carries a label above it — a bare number box is unreadable */
  .fld { display: flex; flex-direction: column; gap: 4px; }
  .fld > span { font-size: 11px; color: var(--faint); text-transform: uppercase;
                letter-spacing: .04em; }
  .fld input, .fld select { width: 100%; }
  .fld input[type=number] { width: 128px; }
  .grow { flex: 1; min-width: 200px; }
  .ann { display: flex; align-items: center; gap: 7px; margin-top: 10px;
         font-size: 12.5px; color: var(--muted); cursor: pointer; }
  /* optional line appended to the public announcement — dimmed while the
     announce box above it is unticked, since it does nothing on its own */
  .notein { width: 100%; margin-top: 7px; font-size: 12.5px; }
  .notein:disabled { opacity: .4; cursor: not-allowed; }
  .muted2 { color: var(--faint); }
  .hintline { font-size: 11.5px; color: var(--faint); margin-top: 7px; }
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<div class="aurora" aria-hidden="true"></div>

<main class="aw">
  <div id="gate" class="gate">
    <h1>👥 Player Admin</h1>
    <p class="muted" id="gateMsg">Sign in with Discord to continue.</p>
    <button id="signInBtn" class="btn gold" style="margin-top:14px">Sign in with Discord</button>
  </div>

  <div id="panel" style="display:none">
    <div class="ahead">
      <h1>👥 Player Admin</h1>
      <div class="navlinks">
        <a href="admin-home.html">← Admin home</a>
        <a href="analytics.html">📊 Analytics</a>
        <a id="signOutBtn" href="#">Sign out</a>
      </div>
    </div>
    <p class="subtle" id="note">Changes are queued here and applied by the bot within a few seconds.</p>

    <div class="cols">
      <div class="panel">
        <h2>Players</h2>
        <input id="search" type="text" placeholder="Find a player…" style="width:100%" />
        <div id="plist" class="plist"></div>
      </div>

      <div class="panel" id="detail">
        <p class="muted2">Pick a player on the left.</p>
      </div>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/players.js"></script>
</body>
</html>
